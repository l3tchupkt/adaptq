[build-system]
requires = ["setuptools>=42", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptq"
version = "0.2.2"
authors = [
  { name="Lakshmikanthan K (letchupkt)", email="letchupkt.dev@gmail.com" },
]
description = "Adaptive Streaming Vector Quantization KV Cache for LLMs — with Replay + Compare + Multi-Backend Integration (V2.1)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "kv-cache", "quantization", "attention", "inference",
            "transformers", "llama-cpp", "replay", "snapshot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
torch        = ["torch>=2.0"]
transformers = ["transformers>=4.36", "accelerate", "torch>=2.0"]
llama        = ["llama-cpp-python>=0.2.0"]
ollama       = ["requests>=2.28"]
vllm         = ["vllm>=0.4"]
mlx          = ["mlx>=0.12", "mlx-lm"]
all-backends = [
    "transformers>=4.36", "accelerate", "torch>=2.0",
    "llama-cpp-python>=0.2.0",
    "requests>=2.28",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "numpy",
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate",
    "llama-cpp-python>=0.2.0",
    "requests",
    "huggingface-hub",
]

[project.urls]
"Homepage"    = "https://github.com/l3tchupkt/adaptq"
"Bug Tracker" = "https://github.com/l3tchupkt/adaptq/issues"
"Changelog"   = "https://github.com/l3tchupkt/adaptq/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/l3tchupkt/adaptq/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests", "integration_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "transformers: requires transformers backend",
    "llama_cpp_python: requires llama-cpp-python + GGUF model",
    "ollama: requires Ollama server running",
    "gpu_required: requires CUDA GPU",
    "slow: long-running test",
]
