
name: AdapTQ V2.1 Integration Tests

on:
  push:
    branches:
      - main
      - v2.1
      - v2
  pull_request:
    branches:
      - main
      - v2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Job 1: C++ Unit, Conformance and Security Tests
  cpp-tests:
    name: C++ Unit & Security Tests (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgomp1

      - name: Configure CMake
        run: |
          cmake -B build_release -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ project
        run: cmake --build build_release --parallel 4

      - name: Run unit, conformance and security tests
        run: ctest --test-dir build_release --output-on-failure -j4


  # Job 2: Python Adapter Contract Tests
  adapter-contract:
    name: Adapter Contract Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgomp1

      - name: Install AdapTQ and backends
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers accelerate
          pip install llama-cpp-python requests pytest

      - name: Run adapter contract tests
        run: |
          pytest integration_tests/test_adapter_contract.py -v


  # Job 3: Transformers Integration Tests
  transformers-integration:
    name: Transformers Integration Tests
    runs-on: ubuntu-latest

    # Run only on push to main because model downloads are time-consuming
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgomp1

      - name: Install AdapTQ and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers accelerate pytest huggingface-hub
          pip install pytest-timeout

      - name: Run Transformers integration tests
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
          TRANSFORMERS_OFFLINE: '0'
        run: |
          pytest integration_tests/test_transformers.py -v \
            --model-hf Qwen/Qwen2-0.5B \
            -x --timeout=300


  # Job 4: Python Validation Suite
  python-validation:
    name: Python Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgomp1

      - name: Build C++ for Python tests
        run: |
          cmake -B build_release -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release --parallel 4

      - name: Install AdapTQ and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 numpy
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest

      - name: Run Python validation suite
        run: |
          python tests/run_tests.py --stage 2
          pytest tests/test_replay_api.py -v
