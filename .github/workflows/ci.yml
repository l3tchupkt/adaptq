
name: AdapTQ CI

on:
  push:
    branches:
      - main
      - dev
      - 'v*'
  pull_request:
    branches:
      - main
      - v2

permissions:
  contents: read

# Cancel previous runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Linux C++ build and tests
  build-linux:
    name: Linux C++ (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgomp1 python3-pip python3-venv

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DADAPTQ_BUILD_TESTS=ON

      - name: Build C++ project
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --build-config Release --output-on-failure --parallel 4
        working-directory: build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 numpy
          python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Verify Python imports
        run: |
          python -c "import adaptq; print('adaptq version:', adaptq.__version__)"
          python -c "import adaptq_py; print('adaptq_py extension loaded OK')"

      - name: Run accuracy tests
        run: python tests/test_accuracy.py

      - name: Run core API tests
        run: python tests/run_tests.py

  # Job 2: Windows C++ build and tests
  build-windows:
    name: Windows C++ (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 numpy torch
          python -m pip install -e .

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DADAPTQ_BUILD_TESTS=ON

      - name: Build C++ project
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --build-config Release --output-on-failure --parallel 4
        working-directory: build

      - name: Verify Python imports
        run: |
          python -c "import adaptq; print('adaptq version:', adaptq.__version__)"
          python -c "import adaptq_py; print('adaptq_py extension loaded OK')"

      - name: Run core API tests
        run: python tests/run_tests.py

  # Job 3: Python version compatibility matrix
  python-package:
    name: Python ${{ matrix.python-version }} (Ubuntu)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 numpy
          python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Verify Python imports
        run: |
          python -c "import adaptq; print('adaptq', adaptq.__version__)"
          python -c "import adaptq_py; print('C extension OK')"

      - name: Run accuracy tests
        run: python tests/test_accuracy.py

      - name: Run unit and LA policy tests
        run: |
          python -m pytest tests/test_la_policy.py tests/test_packed_kv.py \
            -v --tb=short -q

      - name: Run integration contract tests
        run: |
          python -m pytest integration_tests/test_adapter_contract.py \
            -v --tb=short -q

      - name: Run benchmark
        run: python python/benchmark.py
        continue-on-error: true
