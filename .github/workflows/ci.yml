name: AdapTQ CI

on:
  push:
    branches: [ "main", "dev", "v*" ]
  pull_request:
    branches: [ "main", "v2" ]

permissions:
  contents: read

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Linux Native (GCC)
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-pip python3-venv

      - name: Configure CMake (Release)
        run: |
          cmake -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DADAPTQ_BUILD_TESTS=ON

      - name: Build CMake
        run: cmake --build build --config Release --parallel

      - name: CTest (Unit, Conformance, Security)
        run: ctest --build-config Release --output-on-failure --parallel 4
        working-directory: build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install numpy torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Python accuracy + API integration
        run: |
          python3 tests/test_accuracy.py
          python3 tests/run_tests.py

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Windows Native (MSVC)
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install numpy torch
          pip install -e .

      - name: Configure CMake (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DADAPTQ_BUILD_TESTS=ON
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CTest (Unit, Conformance, Security)
        run: ctest --build-config Release --output-on-failure --parallel 4
        working-directory: build

      - name: Python accuracy + API integration
        run: |
          python tests\test_accuracy.py
          python tests\run_tests.py
        shell: pwsh

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Python package (Build + Validation)
  # ─────────────────────────────────────────────────────────────────────────
  python-package:
    name: Python Package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package strictly (includes PyBind11 compilation)
        # We explicitly install PyTorch here for tests/benchmarks since they require it
        run: |
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]

      - name: Verify Import
        run: |
          python -c "import adaptq; print('Successfully imported:', adaptq.__file__)"

      - name: Run Accuracy Tests
        run: |
          python tests/test_accuracy.py

      - name: Pytest Execution (Integration & Unit)
        # Avoid running tests that require a GPU since GitHub Actions runner is CPU-only
        run: |
          pytest tests integration_tests -m "not gpu_required"

      - name: Benchmark (Informational)
        run: |
          python python/benchmark.py || true
